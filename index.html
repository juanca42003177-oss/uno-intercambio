
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uno Intercambio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b0e11;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .btn-worldcoin {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 14px 24px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
    }
    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #9aa0a6;
      white-space: pre-wrap;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Uno Intercambio</h1>
    <p style="color: #9aa0a6; margin-top: 8px;">Conecta tu World App para continuar</p>
    <button class="btn-worldcoin" id="login-btn">Conectar con World App</button>
    <div id="status">Cargando...</div>
  </div>

  <script type="module">
    import { MiniKit } from "https://cdn.jsdelivr.net/npm/@worldcoin/minikit-js@1/+esm";

    const statusEl = document.getElementById("status");
    const loginBtn = document.getElementById("login-btn");

    function setStatus(msg) {
      statusEl.textContent = msg;
      console.log(msg);
    }

    // Inicialización
    try {
      const result = MiniKit.install();
      setStatus("MiniKit instalado: " + JSON.stringify(result));

      if (!MiniKit.isInstalled()) {
        setStatus("MiniKit no está disponible. Abre esta página dentro de World App, no en un navegador normal.");
      } else {
        setStatus("MiniKit detectado correctamente dentro de World App.");
      }
    } catch (err) {
      setStatus("Error al instalar MiniKit: " + (err.message || String(err)));
    }

    loginBtn.addEventListener("click", async () => {
      try {
        if (!MiniKit.isInstalled()) {
          setStatus("No estás dentro de World App o MiniKit no inicializó.");
          return;
        }

        const nonce = crypto.randomUUID().replace(/-/g, "");
        setStatus("Iniciando walletAuth...");

        const result = await MiniKit.walletAuth({ nonce });

        setStatus("Respuesta:\n" + JSON.stringify(result, null, 2));
      } catch (err) {
        setStatus("Error en walletAuth: " + (err.message || String(err)));
      }
    });
  </script>
</body>
</html>
