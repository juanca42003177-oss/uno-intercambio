<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uno Intercambio</title>
  <!-- Cargamos la librería oficial de Worldcoin de forma clásica -->
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      background: #0b0e11;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    button {
      background: white;
      color: black;
      border: none;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button:active {
      background: #cccccc;
    }
    button:disabled {
      background: #555;
      color: #aaa;
      cursor: not-allowed;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
    #panel-intercambio {
      display: none;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Pantalla de Inicio de Sesión -->
  <div class="container" id="login-screen">
    <h1>Uno Intercambio</h1>
    <p>Conecta tu World App para continuar</p>
    <button id="btn-connect">Conectar Wallet</button>
    <div class="status" id="status-text">Listo para conectar.</div>
  </div>

  <!-- Pantalla del Intercambio (Se activa al iniciar sesión con éxito) -->
  <div id="panel-intercambio">
    <h1>¡Bienvenido a Uno Intercambio!</h1>
    <p>Tu sesión ha sido iniciada correctamente con tu World ID.</p>
    <!-- Aquí irá el diseño o menú de tu pasarela de intercambio -->
  </div>

  <script>
// 1. Inicialización automática al cargar el documento
document.addEventListener("DOMContentLoaded", () => {
    if (typeof MiniKit !== 'undefined') {
        MiniKit.install();
        console.log("MiniKit inicializado.");
    }
});

// 2. Vinculación de elementos del DOM
// Buscamos el botón dentro de tu div id="panel-intercambio"
const btnConnect = document.getElementById("panel-intercambio")?.querySelector("button") || document.getElementById("btnConnect");
// Asegúrate de que el texto de error/estado tenga id="statusText" en tu HTML o cámbialo por el ID real
const statusText = document.getElementById("statusText") || document.getElementById("panel-intercambio")?.querySelector("p");

if (btnConnect) {
    btnConnect.addEventListener("click", async () => {
        btnConnect.disabled = true;
        if (statusText) statusText.innerText = "Solicitando autorización...";

        // 3. Obtener el SDK global inyectado
        const sdk = window.MiniKit;

        if (!sdk || !sdk.isInstalled()) {
            if (statusText) statusText.innerText = "Error: No se detectó el entorno de World App.";
            btnConnect.disabled = false;
            return;
        }

        try {
            // Generación de nonce seguro para mitigar ataques de replay
            const generadoNonce = btoa(Math.random().toString(36).substring(2));

            // 4. Ejecución del comando de autenticación de billetera oficial
            const resSign = await sdk.commands.walletAuth({
                nonce: generadoNonce,
                requestId: "uno-intercambio-login" // Puedes cambiarlo por tu ID de proyecto
            });

            if (resSign && resSign.status === "success") {
                if (statusText) statusText.innerText = "¡Conexión exitosa!";
                console.log("Datos de la Wallet:", resSign);
                // Aquí guardas la sesión o rediriges al menú del intercambio
            } else {
                if (statusText) statusText.innerText = "Conexión rechazada por el usuario.";
                btnConnect.disabled = false;
            }

        } catch (error) {
            console.error("Error en la conexión:", error);
            if (statusText) statusText.innerText = "Ocurrió un error al conectar la Wallet.";
            btnConnect.disabled = false;
        }
    });
}
</script>
