<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uno Intercambio</title>
  <style>
    body {
      background: #0b0e11;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    button {
      background: white;
      color: black;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }
    button:disabled {
      background: #555;
      color: #aaa;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
    #panel-intercambio {
      display: none;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Pantalla de Conexión -->
  <div class="container" id="login-screen">
    <h1>Uno Intercambio</h1>
    <p>Conecta tu World App para continuar</p>
    <button id="btn-connect">Conectar Wallet</button>
    <div class="status" id="status-text">Cargando MiniKit...</div>
  </div>

  <!-- Pantalla del Intercambio (Se activa al loguearse) -->
  <div id="panel-intercambio">
    <h1>¡Bienvenido a Uno Intercambio!</h1>
    <p>Tu sesión ha sido iniciada correctamente con World ID.</p>
    <!-- Aquí puedes meter todo el diseño de tu pasarela o juego de intercambio -->
  </div>

  <script type="module">
    // Importamos MiniKit de forma segura
    import { MiniKit } from 'https://esm.sh';

    const btnConnect = document.getElementById("btn-connect");
    const statusText = document.getElementById("status-text");

    // Inicializar MiniKit
    try {
      MiniKit.install();
      statusText.innerText = "MiniKit detectado correctamente.";
    } catch (e) {
      statusText.innerText = "Error al iniciar MiniKit.";
    }

    btnConnect.addEventListener("click", async () => {
      btnConnect.disabled = true;
      statusText.innerText = "Solicitando firma en World App...";

      try {
        // Pedir la firma criptográfica a la World App
        const resSign = await MiniKit.commands.walletAuth({
          nonce: Math.random().toString(36).substring(2),
          requestId: "login"
        });

        if (resSign && resSign.address) {
          statusText.innerText = "Verificando credenciales en el servidor...";

          // Mandar los datos al Backend (verify.js)
          const res = await fetch("/api/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              address: resSign.address,
              message: resSign.message,
              signature: resSign.signature
            })
          });

          const data = await res.json();

          if (data.ok) {
            statusText.innerText = "¡Conexión exitosa!";
            // Ocultamos la pantalla de login y mostramos el intercambio
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("panel-intercambio").style.display = "block";
          } else {
            statusText.innerText = "La firma no pudo verificarse en el servidor.";
          }
        } else {
          statusText.innerText = "No se recibió una respuesta válida de la wallet.";
        }
      } catch (e) {
        statusText.innerText = "Error: " + (e.message || String(e));
      } finally {
        btnConnect.disabled = false;
      }
    });
    <script>
    // Inicialización segura usando un intervalo por si MiniKit tarda en inyectarse
    const btnConnect = document.getElementById("btn-connect");
    const statusText = document.getElementById("status-text");

    function verificarMiniKit() {
      if (window.MiniKit || typeof MiniKit !== 'undefined') {
        try {
          MiniKit.install();
          statusText.innerText = "MiniKit detectado correctamente.";
          clearInterval(checkInterval);
        } catch (e) {
          statusText.innerText = "Error al instalar MiniKit.";
        }
      }
    }

    // Comprueba cada 200 milisegundos si ya existe MiniKit
    const checkInterval = setInterval(verificarMiniKit, 200);

    // Si pasan 4 segundos y no detecta, fuerza el estado para no congelar la pantalla
    setTimeout(() => {
      clearInterval(checkInterval);
      if (statusText.innerText === "Cargando MiniKit...") {
        statusText.innerText = "MiniKit inicializado (Modo desarrollo).";
      }
    }, 4000);
  </script>
</body>
</html>
