<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uno Intercambio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0a1e3c,#1a4a8a);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui;padding:20px}
.card{width:100%;max-width:400px;background:rgba(255,255,255,0.1);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:28px;text-align:center}
.binance-logo{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:12px}
.binance-icon{width:34px;height:34px;background:#F3BA2F;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
.binance-text{font-weight:800;color:#F3BA2F;letter-spacing:1px;font-size:13px}
h1{font-size:24px;margin-bottom:8px}
p{color:#a8b9d6;font-size:13px;line-height:1.4}
.btn{background:#fff;color:#0a1e3c;border:none;width:100%;padding:15px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:16px}
.status{margin-top:12px;font-size:12px;padding:10px;border-radius:10px;word-break:break-all}
.ok{background:rgba(16,185,129,0.2);color:#6effb0;border:1px solid #10b981}
.warn{background:rgba(251,191,36,0.2);color:#fde68a;border:1px solid #f59e0b}
</style>
</head>
<body>
<div class="card">
<div class="binance-logo"><div class="binance-icon">◈</div><div class="binance-text">BINANCE</div></div>
<h1>🔁 Uno Intercambio</h1>
<p id="msg">Toque Conectar Wallet para continuar</p>
<div id="status" class="status" style="display:none"></div>
<button class="btn" id="btn">Conectar Wallet</button>
<div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:12px">Intercambio seguro con World App</div>
</div>

<script type="module">
import { MiniKit } from 'https://cdn.jsdelivr.net/npm/@worldcoin/minikit-js@1.8.1/+esm'

const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');
const btn = document.getElementById('btn');

function log(t, type='ok'){
  statusEl.style.display='block';
  statusEl.className='status '+type;
  statusEl.textContent=t;
  console.log(t);
}

// Mostrar si estamos en World App o no, pero NO bloquear
const isWA = navigator.userAgent.includes('WorldApp');
if(isWA){
  msgEl.textContent='Detectado World App - listo para conectar';
  log('✅ World App detectada','ok');
} else {
  msgEl.textContent='Si estás en Chrome es normal, pero el botón igual intentará conectar';
}

btn.onclick = async () => {
  try{
    log('Intentando conectar...','warn');

    // 1. Intentar con MiniKit si existe
    if(MiniKit && MiniKit.isInstalled && MiniKit.isInstalled()){
      log('MiniKit detectado, pidiendo walletAuth...','ok');
      const res = await MiniKit.commandsAsync.walletAuth({
        nonce: Math.random().toString(36).substring(2,10),
        statement: 'Conectar a Uno Intercambio',
        expirationTime: new Date(Date.now()+3600000)
      });
      if(res.finalPayload.status==='success'){
        log('CONECTADO: '+res.finalPayload.address.slice(0,6)+'...'+res.finalPayload.address.slice(-4),'ok');
        btn.textContent='✅ Conectado';
        return;
      } else {
        log('WalletAuth cancelado: '+res.finalPayload.status,'warn');
        return;
      }
    }

    // 2. Fallback: window.ethereum (algunas versiones de World App lo usan)
    if(window.ethereum){
      log('Probando con window.ethereum...','warn');
      const acc = await window.ethereum.request({method:'eth_requestAccounts'});
      log('CONECTADO: '+acc[0].slice(0,6)+'...','ok');
      btn.textContent='✅ Conectado';
      return;
    }

    log('No se encontró MiniKit ni ethereum. Asegúrate de abrir este link con World App > Browser y que tu World App esté actualizada','warn');

  }catch(e){
    log('Error: '+e.message,'warn');
  }
};
</script>
</body>
</html>
