<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Uno Intercambio</title>

<script type="module">
  import { MiniKit } from 'https://cdn.jsdelivr.net/npm/@worldcoin/minikit-js@latest/+esm';
  window.MiniKit = MiniKit;
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#111;padding-bottom:100px}
.top{padding:14px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #f0f0f0}
.avatar{width:48px;height:48px;border-radius:50%;background:#0B0E11;display:flex;align-items:center;justify-content:center;border:2px solid #f3ba2f;color:#f3ba2f;font-weight:900}
.big{font-size:34px;font-weight:900}
.small{font-size:12px;opacity:.65}
.green{color:#00b15c}
.red{color:#ff3b30}
.btns{display:flex;gap:8px;padding:12px 16px}
.btn{flex:1;background:#ffe6f4;color:#ff3ab2;border-radius:16px;padding:12px 4px;font-weight:700;text-align:center;font-size:13px;cursor:pointer}
.tokens{padding:0 16px 20px}
.tok{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #f1f1f1;align-items:center}
.tIcon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;padding:10px 0;z-index:50}
.nav div{flex:1;text-align:center;font-size:11px;color:#888;cursor:pointer}
.nav .active{color:#111;font-weight:700}
.screen{display:none;padding:16px}
.screen.active{display:block}
.card{background:#f8f8f8;border-radius:18px;padding:16px;margin-bottom:14px}
input,select{width:100%;padding:14px;border-radius:14px;border:1px solid #ddd;font-size:16px;margin:8px 0}
.primary{background:#111;color:#fff;border:none;border-radius:16px;padding:16px;width:100%;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px}
.primary:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.badge{background:#f3ba2f;color:#000;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:24px;width:90%;max-width:360px;text-align:center}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="top">
    <div class="avatar">U</div>
    <div style="flex:1">
      <div style="font-weight:700">Uno Intercambio</div>
      <div class="small" id="walletInfo">No conectado • World Chain</div>
    </div>
    <button id="btnConnect" onclick="connectWallet()" style="background:#f3ba2f;border:none;padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer">Conectar</button>
  </div>

  <div style="padding:20px 16px">
    <div class="small">Balance total</div>
    <div class="big" id="totalUsd">$0.00</div>
    <div class="small" id="wldBalanceText">0 WLD</div>
  </div>

  <div class="btns">
    <div class="btn" onclick="showScreen('swap')">Swap</div>
    <div class="btn" onclick="showScreen('send')">Enviar</div>
    <div class="btn" onclick="loadRealBalances()">Actualizar</div>
  </div>

  <div class="tokens" id="tokenList"></div>
</div>

<!-- SWAP -->
<div id="swap" class="screen">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <div onclick="showScreen('home')" style="font-size:22px;cursor:pointer">←</div>
    <div style="font-weight:800;font-size:18px">Intercambiar</div>
  </div>

  <div class="card">
    <div class="small">De</div>
    <select id="fromToken" onchange="calcSwap()"></select>
    <input type="number" id="fromAmount" placeholder="0.0" oninput="calcSwap()">
    <div class="row">
      <div class="small">Saldo: <span id="fromBal">0</span></div>
      <div>
        <span class="badge" onclick="setPerc(25)">25%</span>
        <span class="badge" onclick="setPerc(50)">50%</span>
        <span class="badge" onclick="setPerc(100)">MAX</span>
      </div>
    </div>
  </div>

  <div style="text-align:center;margin:8px 0;font-size:22px">↓</div>

  <div class="card">
    <div class="small">A</div>
    <select id="toToken" onchange="calcSwap()"></select>
    <input type="number" id="toAmount" placeholder="0.0" readonly>
  </div>

  <div class="card" style="font-size:13px">
    <div class="row"><span>Comisión</span><span>0.5%</span></div>
    <div class="row"><span>Red</span><span>World Chain</span></div>
  </div>

  <button class="primary" id="btnSwap" onclick="doSwap()">Intercambiar</button>
</div>

<!-- SEND -->
<div id="send" class="screen">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <div onclick="showScreen('home')" style="font-size:22px;cursor:pointer">←</div>
    <div style="font-weight:800;font-size:18px">Enviar</div>
  </div>

  <div class="card">
    <div class="small">Token</div>
    <select id="sendToken"></select>
    <div class="small">Destinatario</div>
    <input type="text" id="sendTo" placeholder="0x...">
    <div class="small">Cantidad</div>
    <input type="number" id="sendAmount" placeholder="0.0">
    <div class="small">Saldo: <span id="sendBal">0</span></div>
  </div>

  <button class="primary" onclick="doSend()">Enviar</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div id="modalMsg" style="font-size:16px;margin-bottom:16px"></div>
    <button class="primary" onclick="closeModal()">OK</button>
  </div>
</div>

<div class="nav">
  <div class="active" onclick="showScreen('home')">Inicio</div>
  <div onclick="showScreen('swap')">Swap</div>
  <div onclick="showScreen('send')">Enviar</div>
</div>

<script>
const WORLD_RPC = 'https://worldchain-mainnet.g.alchemy.com/public';
const CHAIN_ID = 480;

const TOKENS = {
  WLD:  { address: '0x2cFc85d8E48F8EAB294be644d9E25C3030863003', decimals: 18, symbol: 'WLD',  color: '#000' },
  DNA:  { address: '0xed49fe44fd4249a09843c2ba4bba7e50beca7113', decimals: 18, symbol: 'DNA',  color: '#6366f1' },
  HUB:  { address: '0xd469fda5d9522a093760902e9be51e0c5d822d26', decimals: 18, symbol: 'HUB',  color: '#0ea5e9' },
  ORO:  { address: '0xcd1e32b86953d79a6ac58e813d2ea7a1790cab63', decimals: 18, symbol: 'ORO',  color: '#f59e0b' },
  USDC: { address: '0x79A02482A880bCE3F13e09Da970dC34db4CD24d1', decimals: 6,  symbol: 'USDC', color: '#2775ca' },
  WETH: { address: '0x4200000000000000000000000000000000000006', decimals: 18, symbol: 'WETH', color: '#627eea' }
};

const SWAP_ROUTER = '0x091AD9e2e6e5eD44c1c66dB50e49A601F9f36cF6';
const PERMIT2     = '0x000000000022D473030F116dDEE9F6B43aC78BA3';

let currentAccount = null;
let balances = {};
let prices = { WLD: 0.40, DNA: 0.00000045, HUB: 0.0000008, ORO: 0.002, USDC: 1, WETH: 3400 };

// ========== UI ==========
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav div').forEach(d => d.classList.remove('active'));
  if (id === 'home') document.querySelectorAll('.nav div')[0].classList.add('active');
  if (id === 'swap') document.querySelectorAll('.nav div')[1].classList.add('active');
  if (id === 'send') document.querySelectorAll('.nav div')[2].classList.add('active');
  if (id === 'swap' || id === 'send') fillSelects();
}

function showModal(msg) {
  document.getElementById('modalMsg').innerText = msg;
  document.getElementById('modal').classList.add('show');
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

// ========== WALLET ==========
async function connectWallet() {
  try {
    if (!window.MiniKit) {
      showModal('Abre esta app dentro de World App');
      return;
    }
    await MiniKit.install();
    const { finalPayload } = await MiniKit.commandsAsync.walletAuth({
      nonce: Math.random().toString(36).slice(2),
      requestId: '0',
      expirationTime: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000),
      notBefore: new Date(Date.now() - 24 * 60 * 60 * 1000),
      statement: 'Conectar Uno Intercambio'
    });
    if (finalPayload.status === 'success') {
      currentAccount = finalPayload.address;
      document.getElementById('walletInfo').innerText = currentAccount.slice(0,6) + '...' + currentAccount.slice(-4) + ' • World Chain';
      document.getElementById('btnConnect').innerText = 'Desconectar';
      document.getElementById('btnConnect').onclick = disconnectWallet;
      document.getElementById('btnConnect').style.background = '#111';
      document.getElementById('btnConnect').style.color = '#fff';
      await loadRealBalances();
    }
  } catch (e) {
    console.error(e);
    showModal('Error al conectar: ' + (e.message || e));
  }
}

function disconnectWallet() {
  currentAccount = null;
  balances = {};
  document.getElementById('walletInfo').innerText = 'No conectado • World Chain';
  document.getElementById('btnConnect').innerText = 'Conectar';
  document.getElementById('btnConnect').onclick = connectWallet;
  document.getElementById('btnConnect').style.background = '#f3ba2f';
  document.getElementById('btnConnect').style.color = '#000';
  document.getElementById('totalUsd').innerText = '$0.00';
  document.getElementById('wldBalanceText').innerText = '0 WLD';
  renderTokenList();
}

// ========== BALANCES REALES ==========
async function rpcCall(method, params) {
  const res = await fetch(WORLD_RPC, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params })
  });
  const json = await res.json();
  return json.result;
}

async function getERC20Balance(tokenAddr, decimals) {
  if (!currentAccount) return 0;
  try {
    const data = '0x70a08231' + currentAccount.slice(2).padStart(64, '0');
    const result = await rpcCall('eth_call', [{ to: tokenAddr, data }, 'latest']);
    if (!result || result === '0x') return 0;
    return Number(BigInt(result)) / (10 ** decimals);
  } catch (e) {
    console.error(e);
    return 0;
  }
}

async function loadRealBalances() {
  if (!currentAccount) {
    showModal('Conecta tu wallet primero');
    return;
  }
  showModal('Cargando saldos reales...');
  for (const [sym, t] of Object.entries(TOKENS)) {
    balances[sym] = await getERC20Balance(t.address, t.decimals);
  }
  closeModal();
  updateUI();
  renderTokenList();
}

function updateUI() {
  let total = 0;
  for (const [sym, bal] of Object.entries(balances)) {
    total += bal * (prices[sym] || 0);
  }
  document.getElementById('totalUsd').innerText = '$' + total.toFixed(2);
  document.getElementById('wldBalanceText').innerText = (balances.WLD || 0).toFixed(4) + ' WLD';
}

function renderTokenList() {
  const list = document.getElementById('tokenList');
  list.innerHTML = '';
  for (const [sym, t] of Object.entries(TOKENS)) {
    const bal = balances[sym] || 0;
    const usd = bal * (prices[sym] || 0);
    list.innerHTML += `
      <div class="tok">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="tIcon" style="background:\( {t.color}"> \){sym.slice(0,2)}</div>
          <div>
            <div style="font-weight:700">${sym}</div>
            <div class="small">World Chain</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:700">${bal.toFixed(bal > 1 ? 2 : 6)}</div>
          <div class="small">$${usd.toFixed(2)}</div>
        </div>
      </div>`;
  }
}

// ========== SELECTS ==========
function fillSelects() {
  const opts = Object.keys(TOKENS).map(s => `<option value="\( {s}"> \){s}</option>`).join('');
  document.getElementById('fromToken').innerHTML = opts;
  document.getElementById('toToken').innerHTML = opts;
  document.getElementById('sendToken').innerHTML = opts;
  document.getElementById('fromToken').value = 'WLD';
  document.getElementById('toToken').value = 'USDC';
  calcSwap();
  updateSendBal();
}

function updateSendBal() {
  const sym = document.getElementById('sendToken').value;
  document.getElementById('sendBal').innerText = (balances[sym] || 0).toFixed(6) + ' ' + sym;
}
document.getElementById('sendToken')?.addEventListener('change', updateSendBal);

// ========== CALC ==========
function calcSwap() {
  const from = document.getElementById('fromToken').value;
  const to = document.getElementById('toToken').value;
  const amount = parseFloat(document.getElementById('fromAmount').value) || 0;
  document.getElementById('fromBal').innerText = (balances[from] || 0).toFixed(6) + ' ' + from;

  if (amount <= 0 || !prices[from] || !prices[to]) {
    document.getElementById('toAmount').value = '';
    return;
  }
  const usd = amount * prices[from];
  const received = (usd / prices[to]) * 0.995; // 0.5% fee
  document.getElementById('toAmount').value = received.toFixed(6);
}

function setPerc(p) {
  const from = document.getElementById('fromToken').value;
  const bal = balances[from] || 0;
  document.getElementById('fromAmount').value = (bal * p / 100).toFixed(6);
  calcSwap();
}

// ========== REAL SWAP ==========
function encodeExactInputSingle(tokenIn, tokenOut, fee, recipient, amountIn, amountOutMinimum) {
  // exactInputSingle((address,address,uint24,address,uint256,uint256,uint160))
  const selector = '0x04e45aaf';
  const params = [
    tokenIn.slice(2).padStart(64, '0'),
    tokenOut.slice(2).padStart(64, '0'),
    fee.toString(16).padStart(64, '0'),
    recipient.slice(2).padStart(64, '0'),
    BigInt(amountIn).toString(16).padStart(64, '0'),
    BigInt(amountOutMinimum).toString(16).padStart(64, '0'),
    '0'.padStart(64, '0') // sqrtPriceLimitX96 = 0
  ].join('');
  return selector + params;
}

function encodeApprove(spender, amount) {
  // approve(address,uint256)
  return '0x095ea7b3' +
    spender.slice(2).padStart(64, '0') +
    BigInt(amount).toString(16).padStart(64, '0');
}

async function doSwap() {
  if (!currentAccount) return showModal('Conecta tu wallet primero');
  const fromSym = document.getElementById('fromToken').value;
  const toSym = document.getElementById('toToken').value;
  const amount = parseFloat(document.getElementById('fromAmount').value);

  if (!amount || amount <= 0) return showModal('Ingresa una cantidad válida');
  if (fromSym === toSym) return showModal('Elige tokens diferentes');
  if ((balances[fromSym] || 0) < amount) return showModal('Saldo insuficiente');

  const from = TOKENS[fromSym];
  const to = TOKENS[toSym];
  const amountIn = BigInt(Math.floor(amount * (10 ** from.decimals)));

  try {
    showModal('Confirmando en World App...');

    // 1) Approve
    // 2) exactInputSingle (fee 3000 = 0.3%)
    const txs = [
      {
        address: from.address,
        data: encodeApprove(SWAP_ROUTER, amountIn)
      },
      {
        address: SWAP_ROUTER,
        data: encodeExactInputSingle(
          from.address,
          to.address,
          3000,
          currentAccount,
          amountIn,
          0n // amountOutMinimum = 0 (puedes mejorar con quote real)
        )
      }
    ];

    const result = await MiniKit.commandsAsync.sendTransaction({
      transaction: txs
    });

    if (result.finalPayload?.status === 'success') {
      showModal('¡Swap enviado!\nUserOp: ' + (result.finalPayload.userOpHash || '').slice(0, 18) + '...');
      setTimeout(loadRealBalances, 4000);
    } else {
      showModal('Swap cancelado o falló');
    }
  } catch (e) {
    console.error(e);
    showModal('Error en swap: ' + (e.message || e));
  }
}

// ========== REAL SEND ==========
function encodeTransfer(to, amount) {
  return '0xa9059cbb' +
    to.slice(2).padStart(64, '0') +
    BigInt(amount).toString(16).padStart(64, '0');
}

async function doSend() {
  if (!currentAccount) return showModal('Conecta tu wallet primero');
  const sym = document.getElementById('sendToken').value;
  const to = document.getElementById('sendTo').value.trim();
  const amount = parseFloat(document.getElementById('sendAmount').value);

  if (!to || !to.startsWith('0x') || to.length !== 42) return showModal('Dirección inválida');
  if (!amount || amount <= 0) return showModal('Cantidad inválida');
  if ((balances[sym] || 0) < amount) return showModal('Saldo insuficiente');

  const token = TOKENS[sym];
  const amountRaw = BigInt(Math.floor(amount * (10 ** token.decimals)));

  try {
    showModal('Confirmando envío...');
    const result = await MiniKit.commandsAsync.sendTransaction({
      transaction: [{
        address: token.address,
        data: encodeTransfer(to, amountRaw)
      }]
    });

    if (result.finalPayload?.status === 'success') {
      showModal('¡Envío enviado correctamente!');
      setTimeout(loadRealBalances, 4000);
    } else {
      showModal('Envío cancelado');
    }
  } catch (e) {
    console.error(e);
    showModal('Error: ' + (e.message || e));
  }
}

// ========== INIT ==========
window.addEventListener('load', async () => {
  if (window.MiniKit) {
    try { await MiniKit.install(); } catch(e) {}
  }
  renderTokenList();
  fillSelects();
});
</script>
</body>
  </html>
