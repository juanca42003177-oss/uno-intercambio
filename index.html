<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uno - Centavos Normales</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4ff;color:#0a1e3c;font-family:system-ui;padding-bottom:70px}
.header{background:#0a1e3c;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.badge{background:#fff;padding:5px 12px;border-radius:20px;display:flex;gap:6px;font-weight:900;font-size:12px;color:#0a1e3c}
.totalCard{background:linear-gradient(135deg,#0a1e3c,#3a5cff);color:#fff;padding:16px;text-align:center;border-radius:0 0 22px 22px}
.total{font-size:36px;font-weight:900}.card{background:#fff;border-radius:16px;margin:10px 12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}

.swapMain{background:#fff;border-radius:20px;margin:12px;padding:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:2px solid #dbe6ff;min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.swapBox{background:#eef4ff;border-radius:14px;padding:14px;margin:8px 0;border:1px solid #dbe6ff}
input{width:100%;background:transparent;border:0;font-size:28px;font-weight:900;outline:none;color:#0a1e3c}
select{border:0;background:#0a1e3c;color:#fff;padding:10px 14px;border-radius:20px;font-weight:900;font-size:14px}
.small{font-size:11px;opacity:.6}.btn{width:100%;padding:14px;border-radius:12px;border:0;background:#f3ba2f;color:#000;font-weight:900;margin-top:8px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a1e3c;display:flex;justify-content:space-around;padding:6px 0}
.nav div{color:#fff;opacity:.5;text-align:center;font-size:10px;padding:4px 8px}.nav div.active{opacity:1;color:#f3ba2f;background:#132c54;border-radius:10px}
</style></head><body>
<div class="header"><div class="badge"><div style="width:18px;height:18px;background:#f3ba2f;border-radius:5px;display:flex;align-items:center;justify-content:center">⬥</div> Uno</div><div style="font-size:10px">Centavos $0.01</div></div>

<div id="vBilletera">

<div class="card"><div id="list"></div></div>
</div>

<div class="swapBox"><div style="display:flex;justify-content:space-between"><span class="small">Recibes</span><span class="small" id="bT" style="font-weight:900"></span></div><div style="display:flex;gap:8px;align-items:center;margin-top:6px"><input id="tAmt" readonly placeholder="0.0"><select id="tSel" onchange="calc()"></select></div></div>
<div class="small" id="rate" style="text-align:center;margin-top:6px"></div><button class="btn" onclick="alert('Swap - Fee 0.3% tú ganas')">Intercambiar Ahora</button></div>
</div>

<div id="vEnviar" style="display:none">

<button class="btn" onclick="alert('Enviar - Fee 0.1%')">Enviar ↗️</button></div>
</div>

<div id="vGanar" style="display:none"><div class="card" style="background:#0a1e3c;color:#fff"><div>My Deposits</div><div style="font-size:32px;font-weight:900">$0.23</div><div class="small" style="color:#fff">14.5% WLD • 13.2% USDC • 16% POL</div></div></div>

<div class="nav"><div class="active" id="nb" onclick="go('billetera')">🏠<br>Billetera</div><div id="ni" onclick="go('intercambio')">🔄<br>Intercambio</div><div id="ns" onclick="go('enviar')">↗️<br>Enviar</div><div id="ng" onclick="go('ganar')">💲<br>Ganar</div></div>

let bals={};
function load(){
 let html='', total=0;

 calc(); updS();
}

};

 document.getElementById('vInter').style.display=v=='intercambio'?'block':'none';
 document.getElementById('vEnviar').style.display=v=='enviar'?'block':'none';
