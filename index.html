<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uno Intercambio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0a1e3c,#1a4a8a);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui;padding:20px}
.card{width:100%;max-width:400px;background:rgba(255,255,255,0.1);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:28px;text-align:center}
.binance-logo{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:12px}
.binance-icon{width:34px;height:34px;background:#F3BA2F;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
.binance-text{font-weight:800;color:#F3BA2F;letter-spacing:1px;font-size:13px}
h1{font-size:24px;margin-bottom:8px}
p{color:#a8b9d6;font-size:13px;line-height:1.4}
.btn{background:#fff;color:#0a1e3c;border:none;width:100%;padding:15px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:16px}
.status{margin-top:12px;font-size:12px;padding:12px;border-radius:10px;display:none;word-break:break-all;text-align:left}
.ok{display:block;background:rgba(16,185,129,0.25);color:#6effb0;border:1px solid #10b981}
.warn{display:block;background:rgba(251,191,36,0.25);color:#fde68a;border:1px solid #f59e0b}
</style>
</head>
<body>
<div class="card">
<div class="binance-logo"><div class="binance-icon">◈</div><div class="binance-text">BINANCE</div></div>
<h1>🔁 Uno Intercambio</h1>
<p id="msg">Toca para conectar tu wallet de World</p>
<div id="status" class="status"></div>
<button class="btn" id="btn">Conectar Wallet</button>
<div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:12px">Intercambio seguro con World App</div>
</div>

<script>
const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');
const btn = document.getElementById('btn');

function show(t,type){
  statusEl.style.display='block';
  statusEl.className='status '+type;
  statusEl.textContent=t;
}

btn.onclick = async () => {
  show('Verificando World App...','warn');

  // World App inyecta MiniKit en window.MiniKit o window.WorldApp
  const mk = window.MiniKit || window.WorldApp?.MiniKit || window.MiniKitJS;
  
  console.log('MiniKit obj:', mk);
  console.log('UserAgent:', navigator.userAgent);

  if(!mk){
    show('❌ No se encontró MiniKit. 1) Asegúrate que tu App ID está aprobado en developer.worldcoin.org 2) Que el dominio uno-intercambio.vercel.app está en la lista de dominios permitidos 3) Actualiza World App. UA: '+navigator.userAgent.slice(0,80),'warn');
    return;
  }

  try{
    show('MiniKit encontrado, solicitando wallet...','ok');
    
    if(mk.commandsAsync){
      const res = await mk.commandsAsync.walletAuth({
        nonce: '12345678',
        statement: 'Conectar a Uno Intercambio'
      });
      show('Respuesta: '+JSON.stringify(res.finalPayload).slice(0,200),'ok');
      if(res.finalPayload.status==='success'){
        msgEl.textContent='Conectado: '+res.finalPayload.address.slice(0,6)+'...';
        btn.textContent='✅ Conectado';
      }
    } else if(mk.commands){
      // versión vieja
      mk.commands.walletAuth({
        nonce: '12345678',
        statement: 'Conectar a Uno Intercambio'
      });
      show('Comando enviado (versión vieja), espera popup...','ok');
    } else {
      show('MiniKit encontrado pero sin commandsAsync. Objeto: '+Object.keys(mk).join(','),'warn');
    }

  }catch(e){
    show('Error JS: '+e.message,'warn');
  }
};

// auto check al cargar
setTimeout(()=>{
  const mk = window.MiniKit || window.WorldApp?.MiniKit;
  if(mk) msgEl.textContent='MiniKit detectado ✅ - toca Conectar';
  else msgEl.textContent='Si no detecta MiniKit, revisa Developer Portal';
},1000);
</script>
</body>
</html>
