<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uno Intercambio - Binance</title>
<script src="https://unpkg.com/@worldcoin/minikit-js@0.0.35/dist/index.umd.js"></script>
<style>
  body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#0a1e3c,#1e3c72);min-height:100vh;display:flex;align-items:center;justify-content:center;color:white}
  .card{background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);border-radius:24px;padding:32px;width:90%;max-width:380px;text-align:center}
  .binance{background:#f3ba2f;color:#000;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:12px;font-weight:900;letter-spacing:1px}
  .logo{width:48px;height:48px;background:#f3ba2f;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:16px auto;font-size:24px}
  h1{margin:10px 0 8px;font-size:32px}
  .sub{opacity:0.7;font-size:14px;margin-bottom:18px}
  .status{font-size:12px;background:rgba(0,0,0,0.3);padding:10px;border-radius:10px;margin-bottom:16px;word-break:break-all;text-align:left}
  .btn{width:100%;padding:16px;border-radius:14px;border:0;font-weight:800;font-size:16px;background:white;color:#0a1e3c;cursor:pointer}
  .btn:active{transform:scale(0.98)}
  .foot{margin-top:14px;font-size:12px;opacity:0.6}
</style>
</head>
<body>
<div class="card">
  <div class="binance">⬥ BINANCE</div>
  <div class="logo">🔄</div>
  <h1>Uno Intercambio</h1>
  <div class="sub" id="sub">Si no detecta MiniKit, revisa Developer Portal</div>
  <div class="status" id="status">Iniciando MiniKit...</div>
  <button class="btn" id="btn" onclick="conectar()">Conectar Wallet</button>
  <div class="foot">Intercambio seguro con World App</div>
</div>

<script>
  const APP_ID = "app_d0a270229b8199adb79b64d5c7aa7c0f";
  let isMiniKit = false;

  function log(msg, ok){
    const el = document.getElementById('status');
    el.innerHTML = (ok ? '✅ ' : '❌ ') + msg + '<br><small>UA: '+navigator.userAgent+'</small>';
    el.style.background = ok ? 'rgba(0,255,100,0.15)' : 'rgba(255,80,80,0.15)';
    el.style.border = '1px solid ' + (ok ? '#00ff88' : '#ff5050');
    document.getElementById('sub').innerText = msg;
  }

  // Instalar MiniKit
  try{
    if(window.MiniKit){
      window.MiniKit.install(APP_ID);
      if(window.MiniKit.isInstalled()){
        isMiniKit = true;
        log('MiniKit detectado correctamente. Listo para conectar.', true);
      } else {
        log('MiniKit instalado pero no está en World App. Abre este link con el QR de vista previa.', false);
      }
    } else {
      log('No se encontró MiniKit. 1) Abre con el QR de Vista Previa de developer.world.org 2) Verifica que el dominio uno-intercambio.vercel.app esté permitido', false);
    }
  }catch(e){
    log('Error instalando MiniKit: '+e.message, false);
  }

  async function conectar(){
    if(!isMiniKit || !window.MiniKit || !window.MiniKit.isInstalled()){
      alert('Abre esta app con el QR de "Vista previa de la miniaplicación" en developer.world.org, no directo en vercel.app');
      return;
    }
    try{
      document.getElementById('btn').innerText = 'Conectando...';
      const res = await window.MiniKit.commandsAsync.walletAuth({
        nonce: Math.random().toString(36).substring(2),
        requestId: '0',
        expirationTime: new Date(new Date().getTime() + 7 * 24 * 60 * 60 * 1000),
        notBefore: new Date(new Date().getTime() - 24 * 60 * 60 * 1000),
        statement: 'Conectar wallet para Uno Intercambio',
      });
      if(res.finalPayload.status === 'success'){
        log('Wallet conectada: ' + res.finalPayload.address, true);
        document.getElementById('btn').innerText = '¡Wallet Conectada! ' + res.finalPayload.address.slice(0,6)+'...';
      } else {
        log('Usuario canceló o falló: '+res.finalPayload.status, false);
        document.getElementById('btn').innerText = 'Conectar Wallet';
      }
    }catch(err){
      log('Error al conectar: '+err.message, false);
      document.getElementById('btn').innerText = 'Conectar Wallet';
    }
  }
</script>
</body>
</html>
