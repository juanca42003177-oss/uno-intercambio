<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uno</title><style>body{margin:0;background:#0a1e3c;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{background:#132c54;border-radius:24px;padding:24px;width:100%;max-width:380px;text-align:center}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:#f3ba2f;font-weight:900;margin-top:10px}
input{width:100%;padding:12px;border-radius:10px;border:0;margin-top:10px;box-sizing:border-box}
.small{font-size:11px;opacity:.7;margin-top:8px}</style></head><body>
<div class="card"><div style="background:#f3ba2f;color:#000;display:inline-block;padding:5px 12px;border-radius:8px;font-weight:900">BINANCE</div>
<h2>Uno Intercambio</h2><div id="st">Pega tu wallet de World App</div>
<input id="addrIn" placeholder="0x... tu dirección World App">
<button class="btn" onclick="guardar()">Guardar y Conectar</button>
<div class="small">Para ver tu dirección: Abre World App > Wallet > Recibir > Copiar dirección > Pégala aquí</div>
<div id="out" style="margin-top:12px;font-size:12px;word-break:break-all"></div></div>
<script>
const saved=localStorage.getItem('wld_addr');
if(saved){document.getElementById('addrIn').value=saved; document.getElementById('out').innerText='Guardado: '+saved; document.getElementById('st').innerText='✅ Conectado: '+saved.slice(0,6)+'...'+saved.slice(-4);}
function guardar(){
  const v=document.getElementById('addrIn').value.trim();
  if(!v.startsWith('0x')||v.length<10){alert('Pega una dirección que empiece con 0x');return;}
  localStorage.setItem('wld_addr',v);
  document.getElementById('out').innerText='✅ Wallet guardada: '+v+'\n\n¡Listo para intercambio P2P!';
  document.getElementById('st').innerText='✅ Conectado: '+v.slice(0,6)+'...'+v.slice(-4);
}
</script></body></html>
