<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uno Intercambio</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
    body{background:#0b0e11;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .container{width:100%;max-width:380px;background:#161a1e;padding:28px;border-radius:16px;text-align:center}
    h1{font-size:22px;margin-bottom:6px}
    p{color:#9aa0a6;font-size:14px;margin-bottom:20px}
    .btn{background:#fff;color:#000;border:none;padding:14px;border-radius:50px;font-weight:700;width:100%;cursor:pointer}
    .btn-pay{background:#10b981;color:#fff;display:none;margin-top:12px}
    #status{margin-top:14px;font-size:11px;background:#23282d;padding:10px;border-radius:8px;word-break:break-all;white-space:pre-wrap;text-align:left;min-height:40px}
  </style>
</head>
<body>
  <div class="container">
    <h1>Uno Intercambio</h1>
    <p id="sub">Conecta tu World App</p>
    <button class="btn" id="login">Conectar con World App</button>
    <button class="btn btn-pay" id="pay">Pagar 1 WLD</button>
    <div id="status">Buscando World App...</div>
  </div>

<script>
  const APP_ID = "app_d0a270229b8199adb79b64d5c7aa7c0f";
  const WALLET = "0x49bcFe3c2ba24f90d2E07917fA4504793f5C9B22";
  const statusEl = document.getElementById('status');
  const subEl = document.getElementById('sub');
  const log = m => statusEl.textContent = m;

  function start() {
    const kit = window.MiniKit;
    if (!kit) {
      log("Esperando World App... Si estás en Chrome es normal.\nAbre esto DENTRO de World App.");
      setTimeout(start, 800);
      return;
    }

    try { kit.install(APP_ID); } catch(e){ try{ kit.install(); }catch{} }

    log("✅ Conectado a World App!\nInstalado: " + kit.isInstalled() + "\nDale a Conectar.");
    subEl.textContent = "World App detectada";

    const getCmds = () => kit.commandsAsync || kit.commands;

    document.getElementById('login').onclick = async () => {
      try {
        log("Pidiendo permiso...");
        const cmds = getCmds();
        const r = await cmds.walletAuth({
          nonce: Math.random().toString(36).substring(2),
          statement: "Login Uno Intercambio"
        });
        const p = r.finalPayload || r;
        log(JSON.stringify(p, null, 2));
        if (p.status === "success") {
          document.getElementById('login').style.display = "none";
          document.getElementById('pay').style.display = "block";
          subEl.textContent = "¡Conectado!";
        }
      } catch (err) {
        log("Error login: " + err.message);
      }
    };

    document.getElementById('pay').onclick = async () => {
      try {
        log("Abriendo pago...");
        const cmds = getCmds();
        const r = await cmds.pay({
          reference: "uno_" + Date.now(),
          to: WALLET,
          tokens: [{ symbol: "WLD", token_amount: "1.0" }],
          description: "Pago Uno Intercambio"
        });
        const p = r.finalPayload || r;
        log(JSON.stringify(p, null, 2));
      } catch (err) {
        log("Error pago: " + err.message);
      }
    };
  }

  start();
</script>
</body>
</html>
