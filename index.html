<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Uno Intercambio</title>
<script src="https://cdn.jsdelivr.net/npm/@worldcoin/minikit-js@1.9.0/dist/minikit.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0b0e11;color:#fff;min-height:100vh;padding-bottom:90px}
.header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2329}
.logo{font-size:20px;font-weight:700;color:#f0b90b}
.wallet-btn{background:#1e2329;border:1px solid #2b3139;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.page{padding:20px;display:none}
.page.active{display:block}
.card{background:#1e2329;border-radius:16px;padding:16px;margin-bottom:12px}
.token-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.token-select{display:flex;align-items:center;gap:8px;background:#2b3139;padding:10px 14px;border-radius:12px;cursor:pointer;min-width:120px}
.token-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.amount-input{background:transparent;border:none;color:#fff;font-size:26px;width:100%;text-align:right;outline:none}
.amount-input::placeholder{color:#5e6673}
.swap-arrow{width:42px;height:42px;background:#2b3139;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:-8px auto 8px;cursor:pointer;font-size:20px;border:4px solid #0b0e11;position:relative;z-index:2}
.info-row{display:flex;justify-content:space-between;font-size:13px;color:#848e9c;margin:8px 0}
.btn-primary{width:100%;background:#f0b90b;color:#000;border:none;padding:16px;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
.btn-primary:disabled{background:#2b3139;color:#5e6673;cursor:not-allowed}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1e2329;display:flex;border-top:1px solid #2b3139;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;text-align:center;padding:14px 0;font-size:12px;color:#848e9c;cursor:pointer}
.nav-item.active{color:#f0b90b}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:flex-end;z-index:200}
.modal.show{display:flex}
.modal-content{background:#1e2329;width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:70vh;overflow-y:auto}
.token-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #2b3139;cursor:pointer}
.token-item:last-child{border-bottom:none}
.balance{font-size:12px;color:#848e9c;margin-top:4px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e2329;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:999;display:none;border:1px solid #2b3139;max-width:90%;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Uno Intercambio</div>
  <button class="wallet-btn" id="connectBtn" onclick="connectWallet()">Conectar</button>
</div>

<!-- HOME -->
<div id="home" class="page active">
  <div class="card">
    <div style="font-size:14px;color:#848e9c;margin-bottom:6px">Saldo total estimado</div>
    <div style="font-size:28px;font-weight:700" id="totalBalance">$0.00</div>
  </div>
  <div class="card" id="tokenList"></div>
</div>

<!-- SWAP -->
<div id="swap" class="page">
  <div class="card">
    <div style="font-size:12px;color:#848e9c;margin-bottom:8px">Pagas</div>
    <div class="token-row">
      <div class="token-select" onclick="openTokenModal('from')">
        <div class="token-icon" id="fromIcon" style="background:#f0b90b">WLD</div>
        <span id="fromSymbol">WLD</span>
      </div>
      <div style="flex:1;text-align:right">
        <input type="number" class="amount-input" id="fromAmount" placeholder="0.0" oninput="calc()" inputmode="decimal">
        <div class="balance" id="fromBalance">Saldo: 0</div>
      </div>
    </div>
  </div>

  <div class="swap-arrow" onclick="switchTokens()">⇅</div>

  <div class="card">
    <div style="font-size:12px;color:#848e9c;margin-bottom:8px">Recibes</div>
    <div class="token-row">
      <div class="token-select" onclick="openTokenModal('to')">
        <div class="token-icon" id="toIcon" style="background:#2775ca">USDC</div>
        <span id="toSymbol">USDC</span>
      </div>
      <div style="flex:1;text-align:right">
        <input type="number" class="amount-input" id="toAmount" placeholder="0.0" readonly>
        <div class="balance" id="toBalance">Saldo: 0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="info-row"><span>Tasa</span><span id="rateText">-</span></div>
    <div class="info-row"><span>Comisión (0.3%)</span><span id="feeText">$0.00</span></div>
    <div class="info-row"><span>Mínimo recibido (0.5% slip)</span><span id="minReceived">-</span></div>
  </div>

  <button class="btn-primary" id="swapBtn" onclick="doSwap()" disabled>Conectar Wallet</button>
</div>

<!-- WALLET -->
<div id="wallet" class="page">
  <div class="card">
    <div style="font-size:14px;color:#848e9c">Dirección conectada</div>
    <div id="walletAddress" style="font-size:13px;word-break:break-all;margin-top:10px">No conectado</div>
  </div>
  <button class="btn-primary" style="background:#2b3139;color:#fff" onclick="disconnectWallet()">Desconectar</button>
</div>

<!-- Modal Tokens -->
<div class="modal" id="tokenModal">
  <div class="modal-content">
    <div style="font-size:18px;font-weight:600;margin-bottom:16px">Seleccionar token</div>
    <div id="tokenModalList"></div>
  </div>
</div>

<div id="toast"></div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="showPage('home')">Inicio</div>
  <div class="nav-item" onclick="showPage('swap')">Swap</div>
  <div class="nav-item" onclick="showPage('wallet')">Wallet</div>
</div>

<script>
// ================== CONFIGURACIÓN ==================
const FEE_WALLET = '0x019001d46cd3155ef045a41f4c359c040595438c';
const FEE_BPS = 30n; // 0.3% = 30 basis points

const SWAP_ROUTER = '0x091AD9e2e6e5eD44c1c66dB50e49A601F9f36cF6'; // SwapRouter02 World Chain
const PERMIT2 = '0x000000000022D473030F116dDEE9F6B43aC78BA3';
const RPC = 'https://worldchain-mainnet.g.alchemy.com/public';

// Tokens oficiales World Chain
const TOKENS = {
  WLD: {
    symbol: 'WLD',
    address: '0x2cFc85d8E48F8EAB294be644d9E25C3030863003',
    decimals: 18,
    color: '#f0b90b',
    price: 0.40
  },
  USDC: {
    symbol: 'USDC',
    address: '0x79A02482A880bCE3F13e09Da970dC34db4CD24d1',
    decimals: 6,
    color: '#2775ca',
    price: 1.00
  }
};

let currentAccount = null;
let fromToken = 'WLD';
let toToken = 'USDC';
let selecting = 'from';
let balances = { WLD: 0, USDC: 0 };

// ================== UTILIDADES ==================
function pad(str, len = 64) {
  return str.replace('0x', '').toLowerCase().padStart(len, '0');
}

function encodeTransfer(to, amount) {
  // transfer(address,uint256) → 0xa9059cbb
  return '0xa9059cbb' + pad(to) + pad(amount.toString(16));
}

function encodeApprove(spender, amount) {
  // approve(address,uint256) → 0x095ea7b3
  return '0x095ea7b3' + pad(spender) + pad(amount.toString(16));
}

function encodeExactInputSingle(tokenIn, tokenOut, fee, recipient, amountIn, amountOutMin) {
  // exactInputSingle((address,address,uint24,address,uint256,uint256,uint160))
  // selector: 0x04e45aaf
  const selector = '04e45aaf';
  const data =
    pad(tokenIn) +
    pad(tokenOut) +
    pad(fee.toString(16), 64) +
    pad(recipient) +
    pad(amountIn.toString(16)) +
    pad(amountOutMin.toString(16)) +
    pad('0'); // sqrtPriceLimitX96 = 0

  return '0x' + selector + data;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3500);
}

// ================== UI ==================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if (id === 'home') renderHome();
  if (id === 'swap') updateSwapUI();
}

function renderHome() {
  const list = document.getElementById('tokenList');
  list.innerHTML = '';
  let total = 0;
  Object.keys(TOKENS).forEach(sym => {
    const t = TOKENS[sym];
    const bal = balances[sym] || 0;
    total += bal * t.price;
    list.innerHTML += `
      <div class="token-item">
        <div class="token-icon" style="background:\( {t.color}"> \){sym.slice(0,3)}</div>
        <div style="flex:1">
          <div style="font-weight:600">${sym}</div>
          <div class="balance">${bal.toFixed(6)}</div>
        </div>
        <div>$${(bal * t.price).toFixed(2)}</div>
      </div>`;
  });
  document.getElementById('totalBalance').innerText = '$' + total.toFixed(2);
}

function updateSwapUI() {
  const f = TOKENS[fromToken];
  const t = TOKENS[toToken];
  document.getElementById('fromIcon').style.background = f.color;
  document.getElementById('fromIcon').innerText = f.symbol.slice(0,3);
  document.getElementById('fromSymbol').innerText = f.symbol;
  document.getElementById('toIcon').style.background = t.color;
  document.getElementById('toIcon').innerText = t.symbol.slice(0,3);
  document.getElementById('toSymbol').innerText = t.symbol;
  document.getElementById('fromBalance').innerText = 'Saldo: ' + (balances[fromToken] || 0).toFixed(6);
  document.getElementById('toBalance').innerText = 'Saldo: ' + (balances[toToken] || 0).toFixed(6);
  calc();
}

function openTokenModal(side) {
  selecting = side;
  const list = document.getElementById('tokenModalList');
  list.innerHTML = '';
  Object.keys(TOKENS).forEach(sym => {
    const t = TOKENS[sym];
    list.innerHTML += `
      <div class="token-item" onclick="selectToken('${sym}')">
        <div class="token-icon" style="background:\( {t.color}"> \){sym.slice(0,3)}</div>
        <div style="font-weight:600">${sym}</div>
      </div>`;
  });
  document.getElementById('tokenModal').classList.add('show');
}

function selectToken(sym) {
  if (selecting === 'from') fromToken = sym;
  else toToken = sym;
  document.getElementById('tokenModal').classList.remove('show');
  updateSwapUI();
}

function switchTokens() {
  const tmp = fromToken;
  fromToken = toToken;
  toToken = tmp;
  document.getElementById('fromAmount').value = '';
  updateSwapUI();
}

function calc() {
  const amt = parseFloat(document.getElementById('fromAmount').value) || 0;
  const pf = TOKENS[fromToken].price;
  const pt = TOKENS[toToken].price;
  const usd = amt * pf;
  const fee = usd * 0.003;
  const receive = (usd - fee) / pt;

  document.getElementById('toAmount').value = receive > 0 ? receive.toFixed(6) : '0';
  document.getElementById('feeText').innerText = '$' + fee.toFixed(4);
  document.getElementById('rateText').innerText = `1 ${fromToken} ≈ ${(pf / pt).toFixed(4)} ${toToken}`;
  document.getElementById('minReceived').innerText = (receive * 0.995).toFixed(6) + ' ' + toToken;
}

// ================== WALLET ==================
async function connectWallet() {
  try {
    if (typeof MiniKit === 'undefined' || !MiniKit.isInstalled()) {
      showToast('Abre esta Mini App dentro de World App');
      return;
    }

    const nonce = crypto.randomUUID().replace(/-/g, '');
    const result = await MiniKit.walletAuth({ nonce });

    if (result && result.data && result.data.address) {
      currentAccount = result.data.address;
      document.getElementById('connectBtn').innerText = currentAccount.slice(0,6) + '...' + currentAccount.slice(-4);
      document.getElementById('walletAddress').innerText = currentAccount;
      document.getElementById('swapBtn').disabled = false;
      document.getElementById('swapBtn').innerText = 'Intercambiar';
      await loadBalances();
      showToast('Wallet conectada correctamente');
    }
  } catch (e) {
    console.error(e);
    showToast('Error al conectar wallet');
  }
}

function disconnectWallet() {
  currentAccount = null;
  balances = { WLD: 0, USDC: 0 };
  document.getElementById('connectBtn').innerText = 'Conectar';
  document.getElementById('walletAddress').innerText = 'No conectado';
  document.getElementById('swapBtn').disabled = true;
  document.getElementById('swapBtn').innerText = 'Conectar Wallet';
  renderHome();
  updateSwapUI();
}

async function loadBalances() {
  if (!currentAccount) return;

  try {
    // balanceOf(address)
    const data = '0x70a08231' + pad(currentAccount);

    const [wldRes, usdcRes] = await Promise.all([
      fetch(RPC, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          jsonrpc: '2.0', id: 1, method: 'eth_call',
          params: [{ to: TOKENS.WLD.address, data }, 'latest']
        })
      }).then(r => r.json()),
      fetch(RPC, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          jsonrpc: '2.0', id: 2, method: 'eth_call',
          params: [{ to: TOKENS.USDC.address, data }, 'latest']
        })
      }).then(r => r.json())
    ]);

    if (wldRes.result) {
      balances.WLD = Number(BigInt(wldRes.result)) / 1e18;
    }
    if (usdcRes.result) {
      balances.USDC = Number(BigInt(usdcRes.result)) / 1e6;
    }
  } catch (e) {
    console.error('Error cargando balances', e);
  }

  renderHome();
  updateSwapUI();
}

// ================== SWAP CON COMISIÓN REAL 0.3% ==================
async function doSwap() {
  if (!currentAccount) return showToast('Conecta tu wallet primero');

  const amount = parseFloat(document.getElementById('fromAmount').value);
  if (!amount || amount <= 0) return showToast('Ingresa una cantidad válida');
  if (fromToken === toToken) return showToast('Elige tokens diferentes');

  const tokenIn = TOKENS[fromToken];
  const tokenOut = TOKENS[toToken];

  const amountIn = BigInt(Math.floor(amount * (10 ** tokenIn.decimals)));
  const feeAmount = (amountIn * FEE_BPS) / 10000n;   // 0.3%
  const amountToSwap = amountIn - feeAmount;

  if (amountToSwap <= 0n) return showToast('Cantidad demasiado pequeña');

  // Slippage 0.5%
  const estimatedOut = (amount * tokenIn.price * 0.997) / tokenOut.price;
  const amountOutMin = BigInt(Math.floor(estimatedOut * 0.995 * (10 ** tokenOut.decimals)));

  // Fee tier más usado en WLD/USDC (0.05% = 500 o 0.3% = 3000)
  const poolFee = 500; // 0.05%

  try {
    showToast('Confirma la transacción en World App...');

    const transactions = [
      // 1. Transferir comisión 0.3% a tu wallet
      {
        to: tokenIn.address,
        data: encodeTransfer(FEE_WALLET, feeAmount),
        value: '0x0'
      },
      // 2. Aprobar el router por la cantidad a intercambiar
      {
        to: tokenIn.address,
        data: encodeApprove(SWAP_ROUTER, amountToSwap),
        value: '0x0'
      },
      // 3. Ejecutar el swap
      {
        to: SWAP_ROUTER,
        data: encodeExactInputSingle(
          tokenIn.address,
          tokenOut.address,
          poolFee,
          currentAccount,
          amountToSwap,
          amountOutMin
        ),
        value: '0x0'
      }
    ];

    const result = await MiniKit.sendTransaction({
      chainId: 480,
      transactions
    });

    if (result && result.data && result.data.userOpHash) {
      showToast('¡Swap enviado! Comisión cobrada correctamente');
      setTimeout(loadBalances, 5000);
    } else {
      showToast('Transacción cancelada');
    }
  } catch (e) {
    console.error(e);
    showToast('Error: ' + (e.message || 'Falló el swap'));
  }
}

// Cerrar modal
document.getElementById('tokenModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});

// Init
renderHome();
updateSwapUI();
</script>
</body>
</html>
