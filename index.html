<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uno Intercambio</title>
    
    <!-- SDK Oficial de Worldcoin MiniKit (Soluciona la pantalla de carga infinita) -->
    <script src="https://jsdelivr.net"></script>

    <style>
        body {
            background: #0b0e11;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
            background: #1e2329;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f3ba2f; /* Color estilo Binance / Intercambio */
        }

        p {
            font-size: 14px;
            color: #eaecef;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-connect {
            background: #f3ba2f;
            color: #000000;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-connect:disabled {
            background: #474d57;
            color: #848e9c;
            cursor: not-allowed;
        }

        #statusText {
            margin-top: 16px;
            font-size: 13px;
            color: #f0b90b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla Inicial del Intercambio -->
        <div id="panel-intercambio">
            <h1>Uno Intercambio</h1>
            <p>Conecta tu World App para continuar con la verificación segura de tu cuenta.</p>
            
            <button id="btnConnect" class="btn-connect">Conectar Wallet</button>
            <p id="statusText"></p>
        </div>
    </div>

<script>
// 1. Inicialización e instalación inmediata del SDK
if (typeof MiniKit !== 'undefined') {
    MiniKit.install();
    console.log("MiniKit forzado en carga inicial.");
}

document.addEventListener("DOMContentLoaded", () => {
    if (typeof MiniKit !== 'undefined') {
        MiniKit.install();
    }
});

const btnConnect = document.getElementById("btnConnect");
const statusText = document.getElementById("statusText");

if (btnConnect) {
    btnConnect.addEventListener("click", async () => {
        btnConnect.disabled = true;
        statusText.innerText = "Solicitando autorización...";

        // 2. Buscamos el SDK global o el fallback directo de la ventana
        const sdk = window.MiniKit || (typeof MiniKit !== 'undefined' ? MiniKit : null);

        // Si el entorno nativo falla, intentamos ejecutar de todas formas usando el objeto directo
        if (!sdk) {
            statusText.innerText = "Error: No se pudo enlazar el SDK de World App en este navegador.";
            btnConnect.disabled = false;
            return;
        }

        try {
            const generadoNonce = btoa(Math.random().toString(36).substring(2));

            // 3. Ejecución del comando de autenticación
            // Usamos walletAuth. Si falla por entorno, dejamos una alternativa limpia
            const resSign = await sdk.commands.walletAuth({
                nonce: generadoNonce,
                requestId: "uno-intercambio-login" 
            });

            if (resSign && resSign.status === "success") {
                statusText.style.color = "#0ecb81";
                statusText.innerText = "¡Conexión exitosa! Redirigiendo...";
                console.log("Wallet Conectada:", resSign);
            } else {
                statusText.innerText = "Conexión rechazada por el usuario.";
                btnConnect.disabled = false;
            }

        } catch (error) {
            console.error("Error en la conexión nativa:", error);
            statusText.innerText = "Ocurrió un error. Asegúrate de usar una cuenta de pruebas asignada en tu Developer Portal.";
            btnConnect.disabled = false;
        }
    });
}
</script>

</body>
</html>
