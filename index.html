<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uno Intercambio</title>
  <!-- Cargamos la librería oficial de Worldcoin de forma clásica -->
  <script src="https://esm.sh"></script>
  <style>
    body {
      background: #0b0e11;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    button {
      background: white;
      color: black;
      border: none;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button:active {
      background: #cccccc;
    }
    button:disabled {
      background: #555;
      color: #aaa;
      cursor: not-allowed;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
    #panel-intercambio {
      display: none;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Pantalla de Inicio de Sesión -->
  <div class="container" id="login-screen">
    <h1>Uno Intercambio</h1>
    <p>Conecta tu World App para continuar</p>
    <button id="btn-connect">Conectar Wallet</button>
    <div class="status" id="status-text">Listo para conectar.</div>
  </div>

  <!-- Pantalla del Intercambio (Se activa al iniciar sesión con éxito) -->
  <div id="panel-intercambio">
    <h1>¡Bienvenido a Uno Intercambio!</h1>
    <p>Tu sesión ha sido iniciada correctamente con tu World ID.</p>
    <!-- Aquí irá el diseño o menú de tu pasarela de intercambio -->
  </div>

  <script>
    const btnConnect = document.getElementById("btn-connect");
    const statusText = document.getElementById("status-text");

    // Lógica principal al presionar el botón
    btnConnect.addEventListener("click", async () => {
      btnConnect.disabled = true;
      statusText.innerText = "Solicitando firma en World App...";

      try {
        // Inicializamos la librería justo antes de llamar a la billetera
        if (typeof MiniKit !== 'undefined') {
          MiniKit.install();
        } else if (window.MiniKit) {
          window.MiniKit.install();
        }

        // Buscamos el objeto global inyectado por World App
        const sdk = window.MiniKit || (typeof MiniKit !== 'undefined' ? MiniKit : null);

        if (!sdk) {
          statusText.innerText = "Error: No se detectó el entorno de World App.";
          btnConnect.disabled = false;
          return;
        }

        // Ejecutar comando para pedir autenticación y firma criptográfica
        const resSign = await sdk.commands.walletAuth({
          nonce: Math.random().toString(36).substring(2),
          requestId: "login"
        });

        if (resSign && resSign.address) {
          statusText.innerText = "Verificando credenciales en el servidor...";

          // Enviamos los datos limpios al endpoint de Vercel
          const res = await fetch("/api/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              address: resSign.address,
              message: resSign.message,
              signature: resSign.signature
            })
          });

          const data = await res.json();

          if (data.ok) {
            statusText.innerText = "¡Conexión exitosa!";
            // Cambio visual de pantallas
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("panel-intercambio").style.display = "block";
          } else {
            statusText.innerText = "La firma no pudo ser validada por el servidor.";
          }
        } else {
          statusText.innerText = "La autenticación fue cancelada o no devolvió datos.";
        }
      } catch (e) {
        statusText.innerText = "Error de conexión: " + (e.message || String(e));
      } finally {
        btnConnect.disabled = false;
      }
    });
  </script>
</body>
</html>
