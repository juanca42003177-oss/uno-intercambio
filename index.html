<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uno</title><style>body{margin:0;background:#0a1e3c;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:rgba(255,255,255,.12);border-radius:24px;padding:24px;width:100%;max-width:360px;text-align:center}
.btn{width:100%;padding:16px;border-radius:14px;border:0;background:#f3ba2f;font-weight:900;font-size:16px}
.st{font-size:11px;background:#0006;padding:10px;border-radius:10px;margin:10px 0;text-align:left;word-break:break-all}</style></head><body>
<div class="card"><h2>Uno Intercambio</h2><div id="st" class="st">Cargando...</div><button id="btn" class="btn" onclick="go()">Conectar Wallet</button>
<div id="addr" style="margin-top:10px;font-size:12px;opacity:.8"></div></div>
<script type="module">
import {MiniKit} from 'https://esm.sh/@worldcoin/minikit-js@1.7.0?bundle';
const APP_ID='app_d0a270229b8199adb79b64d5c7aa7c0f';
MiniKit.install(APP_ID);
const st=document.getElementById('st');
st.innerHTML='✅ MiniKit OK<br>isInstalled:'+MiniKit.isInstalled();

window.go=async()=>{
  const btn=document.getElementById('btn');
  try{
    btn.innerText='Firmando...';
    st.innerHTML='⏳ Revisa World App arriba...';
    const {commandPayload, finalPayload} = await MiniKit.commandsAsync.walletAuth({
      nonce: '123-'+Date.now(),
      statement: 'Conectar a Uno Intercambio'
    });
    console.log(finalPayload);
    if(finalPayload.status==='success'){
      st.innerHTML='✅ CONECTADO<br>'+JSON.stringify(finalPayload,null,2).slice(0,500);
      document.getElementById('addr').innerText='Wallet: '+finalPayload.address;
      btn.innerText='¡Conectado! '+finalPayload.address.slice(0,6)+'...';
      btn.style.background='#00ff88';
    }else{
      st.innerHTML='❌ Cancelado: '+JSON.stringify(finalPayload);
      btn.innerText='Reintentar';
    }
  }catch(e){
    st.innerHTML='❌ Error: '+e.message;
    btn.innerText='Reintentar';
  }
};
</script></body></html>
