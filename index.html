<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uno intercambio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #ffffff;
        }
        /* ✅ PANTALLA DE INICIO EXACTA A TU FOTO */
        #pantallaCarga {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .logoGrande {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #F3BA2F;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }
        .logoGrande svg {
            width: 45px;
            height: 45px;
        }
        .btnIniciar {
            width: 280px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 15px 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        /* ✅ EL RESTO DE LA APP: OCULTA, NO APARECE NUNCA */
        #app {
            display: none;
        }
        .oculto {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- ✅ ESTA ES LA ÚNICA PANTALLA QUE SE VE, IGUAL QUE TU FOTO -->
<div id="pantallaCarga">
    <div class="logoGrande">
        <svg viewBox="0 0 32 32">
            <path d="M16 7.5 L19.5 11 L16 14.5 L12.5 11 Z M11 12.5 L14.5 16 L11 19.5 L7.5 16 Z M21 12.5 L24.5 16 L21 19.5 L17.5 16 Z M16 17.5 L19.5 21 L16 24.5 L12.5 21 Z" fill="#000000"/>
        </svg>
    </div>
    <!-- ✅ AL DAR CLIC: NO HACE NADA, NO CAMBIA NADA, SE QUEDA IGUAL -->
    <button class="btnIniciar">Iniciar sesión</button>
</div>

<!-- ✅ ESTA PARTE ESTÁ TODA OCULTA, NO SE VE NI SE ABRE NUNCA -->
<div id="app">
    <div id="home">
        <div class="top">
            <div class="avatar">
                <svg viewBox="0 0 32 32" width="28" height="28">
                    <path d="M16 7.5 L19.5 11 L16 14.5 L12.5 11 Z M11 12.5 L14.5 16 L11 19.5 L7.5 16 Z M21 12.5 L24.5 16 L21 19.5 L17.5 16 Z M16 17.5 L19.5 21 L16 24.5 L12.5 21 Z" fill="#F3BA2F"/>
                </svg>
            </div>
            <div>
                <b>Uno intercambio</b>
                <div class="small">0x0190...38c • World Chain + Polygon • 0.5% + gas aparte</div>
            </div>
        </div>

        <div style="padding:0 16px;display:flex;justify-content:space-between;align-items:center">
            <div>
                <div class="big">$0.04</div>
                <div class="small"><span class="green">▲ $0.01 (5.97%) hoy ></span></div>
            </div>
            <div><svg width="80" height="30"><polyline points="0,28 20,24 40,18 60,10 80,4" fill="none" stroke="#00b15c" stroke-width="2.5"/></svg></div>
        </div>

        <div class="btns">
            <div class="btn">⇆<br>Swap</div>
            <div class="btn">↗<br>Ganar</div>
            <div class="btn">↗<br>Enviar</div>
            <div class="btn">↓<br>Recibir</div>
        </div>

        <div class="tokens">
            <div style="font-weight:900;margin:8px 0">World Chain - tu billetera real</div>
            <div class="tok">
                <div style="display:flex;gap:10px;align-items:center">
                    <div class="tIcon" style="background:#000;color:#fff">W</div>
                    <div><b>WLD</b><div class="small">0.01 WLD • Diamante</div></div>
                </div>
                <div style="text-align:right"><b>$0.01</b><div class="small green">+2.1%</div></div>
            </div>
            <div class="tok">
                <div style="display:flex;gap:10px;align-items:center">
                    <div class="tIcon" style="background:#ffcc00;color:#000">D</div>
                    <div><b>DNA</b><div class="small">615.74 DNA • Hélice - original</div></div>
                </div>
                <div style="text-align:right"><b>$0.03</b><div class="small green">+5.97%</div></div>
            </div>
        </div>
    </div>
</div>

<script>
// ✅ FUNCIÓN VACÍA: AL DAR CLIC NO HACE NADA, NO CAMBIA NADA
function iniciarApp() {
    // NO HAY NADA AQUÍ, POR ESO NO SE MUEVE NI ABRE NADA
}
</script>

</body>
</html>
