<script>
const WORLD_RPC = 'https://worldchain-mainnet.g.alchemy.com/public';
const SWAP_ROUTER = '0x091AD9e2e6e5eD44c1c66dB50e49A601F9f36cF6';
const FEE_WALLET = '0x019001d46cd3155ef045a41f4c359c040595438c';
const FEE_BPS = 30n; 

const ETH_NATIVE = '0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE';

const CONTRACTS = {
  ETH:{address:ETH_NATIVE,isNative:true,decimals:18,color:'#3c3c3d',letter:'Ξ'},
  WETH:{address:'0x4200000000000000000000000000000000000006',decimals:18,color:'#627eea',letter:'WΞ'},
  WLD:{address:'0x2cFc85d8E48F8EAB294be644d9E25C3030863003',decimals:18,color:'#000000',letter:'W'},
  DNA:{address:'0xed49fe44fd4249a09843c2ba4bba7e50beca7113',decimals:18,color:'#ffcc00',letter:'D'},
  HUB:{address:'0xd469fda5d9522a093760902e9be51e0c5d822d26',decimals:18,color:'#ff7a00',letter:'H'},
  ORO:{address:'0xcd1e32b86953d79a6ac58e813d2ea7a1790cab63',decimals:18,color:'#ffd700',letter:'O'},
  USDC:{address:'0x79A02482A880bCE3F13e09Da970dC34db4CD24d1',decimals:6,color:'#2775ca',letter:'$'},
  SUSHI:{address:'0xab09A728E53d3d6BC438BE95eeD46Da0Bbe7FB38',decimals:18,color:'#fa52a0',letter:'S'},
  DIAMANTE:{address:'0x2ba918fec90Ca7AaC5753a2551593470815866e6',decimals:18,color:'#b9f2ff',letter:'◆'},
  PVPB:{address:'0xBC69990A060cC5AF40942f579BdF82A69A9CFf93',decimals:18,color:'#9b59b6',letter:'P'},
  TPF:{address:'0x834a73c0a83F3BCe349A116FFB2A4c2d1C651E45',decimals:18,color:'#1abc9c',letter:'T'},
  AXO:{address:'0x249820C0479D0A7feE6A2A3a14583267550F3caF',decimals:18,color:'#e67e22',letter:'A'}
};

let prices={ETH:3400,WETH:3400,WLD:0.4,DNA:0.00000045,HUB:0.0000008,ORO:0.002,USDC:1,SUSHI:0.5,DIAMANTE:0.0001,PVPB:0.0001,TPF:0.0001,AXO:0.0001};
let changes={ETH:0,WETH:0,WLD:0,DNA:0,HUB:0,ORO:0,USDC:0,SUSHI:0,DIAMANTE:0,PVPB:0,TPF:0,AXO:0};
let balances={}; let currentAccount=null; let selectedToken='WLD';

function showOk(msg,icon){document.getElementById('modalIcon').innerText=icon||'✅';document.getElementById('modalTxt').innerText=msg;document.getElementById('modal').style.display='flex';}

function go(page){
  ['home','swap','earn','send','recv','tokenDetail'].forEach(p=>{
    var el=document.getElementById(p); if(el) el.style.display=(p===page)?'block':'none';
  }); 
  document.querySelectorAll('.nav div').forEach(d=>d.classList.remove('active')); 
  if(page==='home') document.getElementById('navHome').classList.add('active'); 
  if(page==='recv'&&currentAccount){
    document.getElementById('recvAddr').innerText=currentAccount; 
    document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(currentAccount);
  } 
  if(page==='swap'){fillSelects();calc();} 
  if(page==='send'){fillSendSelect();updateSendBal();}
}

function openToken(sym){
  selectedToken=sym; var t=CONTRACTS[sym]; var bal=balances[sym]||0; var price=prices[sym]||0; var ch=changes[sym]||0;
  document.getElementById('dIcon').style.background=t.color; document.getElementById('dIcon').innerText=t.letter;
  document.getElementById('dName').innerText=sym; document.getElementById('dBalText').innerText=bal.toFixed(6)+' '+sym;
  document.getElementById('dPrice').innerText='$'+price.toFixed(price<0.01?8:4);
  document.getElementById('dChange').innerText=(ch>=0?'▲ +':'▼ ')+Math.abs(ch).toFixed(2)+'%';
  document.getElementById('dBal').innerText=bal.toFixed(6)+' '+sym; document.getElementById('dUsd').innerText='$'+(bal*price).toFixed(2);
  go('tokenDetail');
}

function openSwapFromDetail(){go('swap');document.getElementById('fSel').value=selectedToken;calc();}
function openSendFromDetail(){go('send');document.getElementById('sendToken').value=selectedToken;updateSendBal();}

async function connectWallet(){
  try{
    if(!window.MiniKit) return showOk('Abre dentro de World App','⚠️'); 
    MiniKit.install();
    var nonce=Math.random().toString(36).slice(2)+Date.now().toString(36);
    var result=await MiniKit.walletAuth({nonce:nonce,statement:'Conectar Uno Intercambio'}); 
    if(result&&result.data&&result.data.address){
      currentAccount=result.data.address;
      updateUI(currentAccount);
      await loadRealBalances();
    }else showOk('No se pudo conectar','❌');
  }catch(e){showOk('Error: '+(e.message||e),'❌');}
}

function updateUI(addr){
  document.getElementById('walletInfo').innerHTML=addr.slice(0,6)+'...'+addr.slice(-4)+' • World Chain';
  var btn=document.getElementById('btnConnect'); btn.innerText='Desconectar'; btn.onclick=disconnectWallet; btn.style.background='#111'; btn.style.color='#fff';
}

function disconnectWallet(){
  currentAccount=null; balances={};
  document.getElementById('walletInfo').innerHTML='No conectado • World Chain';
  document.getElementById('totalUsd').innerText='$0.00';
  var btn=document.getElementById('btnConnect'); btn.innerText='Conectar'; btn.onclick=connectWallet; btn.style.background='#f3ba2f'; btn.style.color='#000';
  renderTokenList();
}

async function getBalance(tokenKey){
  if(!currentAccount) return 0;
  try{
    var t = CONTRACTS[tokenKey];
    if(t.isNative){
      var res=await fetch(WORLD_RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_getBalance',params:[currentAccount,'latest']})});
      var json=await res.json();
      if(!json.result||json.result==='0x') return 0;
      return Number(BigInt(json.result))/Math.pow(10,18);
    } 
    else {
      var data='0x70a08231'+currentAccount.slice(2).padStart(64,'0');
      var res=await fetch(WORLD_RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to:t.address,data:data},'latest']})});
      var json=await res.json();
      if(!json.result||json.result==='0x') return 0;
      return Number(BigInt(json.result))/Math.pow(10,t.decimals);
    }
  }catch(e){return 0;}
}

async function loadRealBalances(){
  if(!currentAccount) return;
  showOk('Cargando saldos...','⏳');
  for(var sym in CONTRACTS){ balances[sym]=await getBalance(sym); }
  document.getElementById('modal').style.display='none';
  renderTokenList(); updateTotal();
}

function updateTotal(){
  var total=0; for(var sym in balances) total+=(balances[sym]||0)*(prices[sym]||0);
  document.getElementById('totalUsd').innerText='$'+total.toFixed(2);
}

function renderTokenList(){
  var html='<div style="font-weight:800;margin:10px 0 6px">World Chain</div>';
  for(var sym in CONTRACTS){
    var t=CONTRACTS[sym]; var bal=balances[sym]||0; var usd=bal*(prices[sym]||0); var ch=changes[sym]||0;
    html+='<div class="tok" onclick="openToken(\''+sym+'\')"><div style="display:flex;gap:12px;align-items:center"><div class="tIcon" style="background:'+t.color+'">'+t.letter+'</div><div><b>'+sym+'</b><div class="small">'+bal.toFixed(6)+' '+sym+'</div></div></div><div style="text-align:right"><b>$'+usd.toFixed(2)+'</b><div class="small '+(ch>=0?'green':'red')+'">'+(ch>=0?'▲ +':'▼ ')+Math.abs(ch).toFixed(2)+'%</div></div></div>';
  }
  document.getElementById('tokenList').innerHTML=html;
}

function fillSelects(){
  var opts=''; for(var sym in CONTRACTS) opts+='<option value="'+sym+'">'+sym+'</option>';
  document.getElementById('fSel').innerHTML=opts; document.getElementById('tSel').innerHTML=opts;
  document.getElementById('fSel').value=selectedToken||'WLD'; document.getElementById('tSel').value='USDC';
}

function fillSendSelect(){
  var opts=''; for(var sym in CONTRACTS) opts+='<option value="'+sym+'">'+sym+'</option>';
  document.getElementById('sendToken').innerHTML=opts; document.getElementById('sendToken').value=selectedToken||'WLD';
}

function updateSendBal(){
  var sym=document.getElementById('sendToken').value;
  document.getElementById('sendBal').innerText=(balances[sym]||0).toFixed(6)+' '+sym;
}

function calc(){
  var from=document.getElementById('fSel').value; var to=document.getElementById('tSel').value;
  var amt=parseFloat(document.getElementById('fAmt').value)||0;
  document.getElementById('bF').innerText=from; document.getElementById('bT').innerText=to;
  document.getElementById('saldoTxt').innerText=(balances[from]||0).toFixed(6);
  if(amt<=0){document.getElementById('tAmt').value='0';return;}
  var pf=prices[from]||0.0000001; var pt=prices[to]||0.0000001;
  var usd=amt*pf; var fee=usd*0.003;
  document.getElementById('tAmt').value=((usd-fee)/pt).toFixed(6);
  document.getElementById('feeUno').innerText='$'+fee.toFixed(4);
  document.getElementById('totalCommission').innerText='$'+fee.toFixed(4);
}

function setPerc(p){
  document.querySelectorAll('.perc button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  var from=document.getElementById('fSel').value;
  document.getElementById('fAmt').value=((balances[from]||0)*p/100).toFixed(6);
  calc();
}

function encodeApprove(spender,amount){ return '0x095ea7b3'+spender.slice(2).padStart(64,'0')+BigInt(amount).toString(16).padStart(64,'0'); }
function encodeExactInputSingle(tokenIn,tokenOut,fee,recipient,amountIn){ return '0x04e45aaf'+tokenIn.slice(2).padStart(64,'0')+tokenOut.slice(2).padStart(64,'0')+Number(fee).toString(16).padStart(64,'0')+recipient.slice(2).padStart(64,'0')+BigInt(amountIn).toString(16).padStart(64,'0')+'0'.padStart(64,'0')+'0'.padStart(64,'0'); }
function encodeTransfer(to,amount){ return '0xa9059cbb'+to.slice(2).padStart(64,'0')+BigInt(amount).toString(16).padStart(64,'0'); }

async function doSwap(){
  if(!currentAccount) return showOk('Conecta tu wallet','⚠️');
  var fromSym=document.getElementById('fSel').value;
  var toSym=document.getElementById('tSel').value;
  var amount=parseFloat(document.getElementById('fAmt').value);
  if(!amount||amount<=0) return showOk('Cantidad inválida','⚠️');
  if(fromSym===toSym) return showOk('Elige tokens diferentes','⚠️');
  if((balances[fromSym]||0)<amount) return showOk('Saldo insuficiente','⚠️');

  var from=CONTRACTS[fromSym]; var to=CONTRACTS[toSym];
  var amountIn=BigInt(Math.floor(amount*Math.pow(10,from.decimals)));
  var feeAmount = (amountIn * FEE_BPS) / 10000n;
  var amountToSwap = amountIn - feeAmount;

  var targetTokenIn = from.isNative ? CONTRACTS.WETH.address : from.address;
  var targetTokenOut = to.isNative ? CONTRACTS.WETH.address : to.address;
  
  // Pool fee dinámico para tokens memecoin/comunitarios
  var poolFee = 10000; 

  try{
    if(!from.isNative){
      // PASO 1: Ejecutar la aprobación primero de forma independiente para evitar fallos de simulación
      showOk('Paso 1/2: Aprobando token...','⏳');
      var appRes = await MiniKit.sendTransaction({
        chainId: 480,
        transactions: [
          { to: from.address, data: encodeTransfer(FEE_WALLET, feeAmount), value: '0x0' },
          { to: from.address, data: encodeApprove(SWAP_ROUTER, amountToSwap), value: '0x0' }
        ]
      });

      if(!appRes?.data?.userOpHash) return showOk('Aprobación cancelada','❌');
      showOk('Aprobación confirmada. Preparando Swap...','⏳');
      await new Promise(r => setTimeout(r, 2000));
    }

    // PASO 2: Ejecutar el swap
    showOk('Paso 2/2: Confirmando Swap...','⏳');
    var txSwap = [];

    if(from.isNative){
      txSwap.push({ to: FEE_WALLET, value: '0x' + feeAmount.toString(16), data: '0x' });
      txSwap.push({
        to: SWAP_ROUTER,
        data: encodeExactInputSingle(CONTRACTS.WETH.address, targetTokenOut, poolFee, currentAccount, amountToSwap),
        value: '0x' + amountToSwap.toString(16)
      });
    } else {
      txSwap.push({
        to: SWAP_ROUTER,
        data: encodeExactInputSingle(targetTokenIn, targetTokenOut, poolFee, currentAccount, amountToSwap),
        value: '0x0'
      });
    }

    var result = await MiniKit.sendTransaction({ chainId: 480, transactions: txSwap });
    if(result&&result.data&&result.data.userOpHash){
      showOk('¡Swap enviado con éxito!','✅'); setTimeout(loadRealBalances,4000);
    } else showOk('Intercambio no completado','❌');
  }catch(e){showOk('Error: '+(e.message||e),'❌');}
}

async function doSwapSmart(){
  var smartOn = document.getElementById('checkSmart').checked;
  if(!smartOn) return doSwap();
  return doSwap();
}

async function doSend(){
  if(!currentAccount) return showOk('Conecta','⚠️');
  var sym=document.getElementById('sendToken').value;
  var toAddr=document.getElementById('sendTo').value.trim();
  var amount=parseFloat(document.getElementById('sendAmount').value);
  if(!toAddr||!toAddr.startsWith('0x')||toAddr.length!==42) return showOk('Dirección inválida','⚠️');
  if(!amount||amount<=0) return showOk('Cantidad inválida','⚠️');
  if((balances[sym]||0)<amount) return showOk('Saldo insuficiente','⚠️');

  var token=CONTRACTS[sym];
  var amountRaw=BigInt(Math.floor(amount*Math.pow(10,token.decimals)));

  try{
    showOk('Confirma el envío...','⏳');
    var tx = token.isNative ? 
      { to: toAddr, value: '0x' + amountRaw.toString(16), data: '0x' } : 
      { to: token.address, data: encodeTransfer(toAddr, amountRaw), value: '0x0' };

    var result=await MiniKit.sendTransaction({ chainId: 480, transactions: [tx] });
    if(result&&result.data&&result.data.userOpHash){
      showOk('¡Envío realizado con éxito!'); setTimeout(loadRealBalances,5000);
    }else{ showOk('Envío cancelado','❌'); }
  }catch(e){showOk('Error: '+(e.message||e),'❌');}
}

function copyAddr(){
  if(currentAccount){ navigator.clipboard.writeText(currentAccount); showOk('Dirección copiada'); }
}

async function fetchLivePrices(){
  try{
    var res=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=ethereum,worldcoin-wld,usd-coin,weth&vs_currencies=usd&include_24hr_change=true');
    var data=await res.json();
    if(data['ethereum']){ prices.ETH=data['ethereum'].usd||prices.ETH; changes.ETH=data['ethereum'].usd_24h_change||0; }
    if(data['worldcoin-wld']){ prices.WLD=data['worldcoin-wld'].usd||prices.WLD; changes.WLD=data['worldcoin-wld'].usd_24h_change||0; }
    if(data['usd-coin']){ prices.USDC=data['usd-coin'].usd||1; changes.USDC=data['usd-coin'].usd_24h_change||0; }
    if(data['weth']){ prices.WETH=data['weth'].usd||prices.WETH; changes.WETH=data['weth'].usd_24h_change||0; }
    updateTotal(); renderTokenList();
  }catch(e){}

  for(let sym of ['DNA','HUB','ORO','SUSHI','DIAMANTE','PVPB','TPF','AXO']){
    try{
      let r=await fetch('https://api.dexscreener.com/latest/dex/tokens/'+CONTRACTS[sym].address);
      let j=await r.json();
      if(j.pairs&&j.pairs[0]){
        let best=j.pairs.sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0];
        if(best?.priceUsd){
          prices[sym]=parseFloat(best.priceUsd);
          changes[sym]=parseFloat(best.priceChange?.h24||0);
        }
      }
    }catch(e){}
  }
  updateTotal(); renderTokenList();
}

window.addEventListener('load',function(){
  if(window.MiniKit) try{MiniKit.install();}catch(e){} 
  renderTokenList(); fetchLivePrices(); setInterval(fetchLivePrices,60000);
});
</script>
