
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uno Intercambio</title>
  <style>
    body {
      background: #0b0e11;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 14px 20px;
      border: 0;
      border-radius: 999px;
      background: white;
      color: black;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }
    #status {
      margin-top: 18px;
      color: #b0b7c3;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Uno Intercambio</h1>
    <p>Conecta tu World App para continuar</p>
    <button id="test-btn">Probar MiniKit</button>
    <div id="status">Cargando...</div>
  </div>

  <script type="module">
    import { MiniKit } from "https://cdn.jsdelivr.net/npm/@worldcoin/minikit-js/+esm";

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("test-btn");

    function setStatus(msg) {
      statusEl.textContent = msg;
      console.log(msg);
    }

    try {
      setStatus("Import OK. Revisando MiniKit...");

      setStatus(
        "Tipo de MiniKit: " + typeof MiniKit + "\n\n" +
        "Claves disponibles:\n" + Object.keys(MiniKit).sort().join(", ")
      );

      if (typeof MiniKit.install === "function") {
        const result = MiniKit.install();
        setStatus(
          "MiniKit.install() existe.\n\n" +
          "Resultado:\n" + JSON.stringify(result, null, 2) + "\n\n" +
          "Claves disponibles:\n" + Object.keys(MiniKit).sort().join(", ")
        );
      } else {
        setStatus(
          "MiniKit cargó, pero install() no existe.\n\n" +
          "Claves disponibles:\n" + Object.keys(MiniKit).sort().join(", ")
        );
      }
    } catch (e) {
      setStatus("Error al importar/instalar MiniKit:\n" + (e.message || String(e)));
    }

    btn.addEventListener("click", async () => {
      try {
        const methods = Object.keys(MiniKit).sort();

        if (typeof MiniKit.walletAuth === "function") {
          const nonce = crypto.randomUUID().replace(/-/g, "");
          setStatus("walletAuth existe. Ejecutando...");

          const result = await MiniKit.walletAuth({ nonce });
          setStatus("walletAuth OK:\n" + JSON.stringify(result, null, 2));
          return;
        }

        setStatus(
          "walletAuth NO existe en esta versión.\n\n" +
          "Métodos encontrados:\n" + methods.join(", ")
        );
      } catch (e) {
        setStatus("Error al probar método:\n" + (e.message || String(e)));
      }
    });
  </script>
</body>
</html>
