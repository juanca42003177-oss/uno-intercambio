<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Uno Intercambio</title>
<style>
  body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#0a1e3c,#1e3c72);min-height:100vh;display:flex;align-items:center;justify-content:center;color:white;padding:16px}
  .card{background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);border-radius:24px;padding:28px;width:100%;max-width:380px;text-align:center}
  .binance{background:#f3ba2f;color:#000;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:12px;font-weight:900}
  .logo{width:56px;height:56px;background:#f3ba2f;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:16px auto;font-size:28px}
  h1{margin:10px 0 6px;font-size:30px} .sub{opacity:.7;font-size:13px;margin-bottom:12px;word-break:break-all}
  .status{font-size:12px;background:rgba(0,0,0,.35);padding:10px;border-radius:10px;margin-bottom:14px;text-align:left;border:1px solid rgba(255,255,255,.2)}
  .btn{width:100%;padding:16px;border-radius:14px;border:0;font-weight:800;font-size:16px;background:white;color:#0a1e3c;cursor:pointer}
  .btn:disabled{opacity:.5} .foot{margin-top:12px;font-size:11px;opacity:.6}
</style>
</head>
<body>
<div class="card">
  <div class="binance">⬥ BINANCE</div>
  <div class="logo">🔄</div>
  <h1>Uno Intercambio</h1>
  <div class="sub" id="sub">Detectando World App...</div>
  <div class="status" id="status">⏳ Esperando MiniKit...</div>
  <button class="btn" id="btn" disabled onclick="conectar()">Conectar Wallet</button>
  <div class="foot">Abre solo con QR de Vista Previa en developer.world.org</div>
</div>
<script>
const APP_ID = "app_d0a270229b8199adb79b64d5c7aa7c0f";
let intentos = 0;
function setStatus(html, ok){
  const el=document.getElementById('status');
  el.innerHTML=html;
  el.style.background= ok===true ? 'rgba(0,255,120,.18)' : ok===false ? 'rgba(255,60,60,.18)' : 'rgba(0,0,0,.35)';
  el.style.borderColor= ok===true ? '#00ff88' : ok===false ? '#ff5050' : 'rgba(255,255,255,.2)';
}
function detectar(){
  intentos++;
  const mk = window.MiniKit;
  if(mk){
    try{ mk.install(APP_ID); }catch(e){}
    if(mk.isInstalled && mk.isInstalled()){
      setStatus('✅ MiniKit detectado!<br>App ID: '+APP_ID+'<br>World App: '+ (mk.userAgent||'ok'), true);
      document.getElementById('sub').innerText='¡Listo para conectar!';
      document.getElementById('btn').disabled=false;
      return;
    } else {
      setStatus('⚠️ MiniKit instalado pero no es World App.<br>Debes abrir este link CON EL QR de Vista Previa, no escribiendo vercel.app', false);
    }
  } else {
    if(intentos < 20){
      setStatus('⏳ Buscando MiniKit... intento '+intentos+'/20<br>UA: '+navigator.userAgent.slice(0,90), null);
      setTimeout(detectar, 500);
    } else {
      setStatus('❌ No se encontró MiniKit después de 10s.<br>1) Cierra World App por completo<br>2) Ve a developer.world.org > Mini aplicación > Copia el link con los 2 cuadritos (NO el QR de vercel)<br>3) Pega ese link en World App', false);
      document.getElementById('sub').innerText='No se encontró MiniKit';
    }
  }
}
window.addEventListener('load', detectar);

async function conectar(){
  try{
    const mk=window.MiniKit;
    if(!mk || !mk.isInstalled()){ alert('MiniKit no detectado'); return; }
    document.getElementById('btn').innerText='Conectando...';
    const res = await mk.commandsAsync.walletAuth({
      nonce: 'nonce-'+Date.now(),
      requestId: '0',
      expirationTime: new Date(Date.now()+7*24*60*60*1000),
      notBefore: new Date(Date.now()-24*60*60*1000),
      statement: 'Conectar a Uno Intercambio',
    });
    if(res && res.finalPayload && res.finalPayload.status==='success'){
      setStatus('✅ Conectado: '+res.finalPayload.address, true);
      document.getElementById('btn').innerText='Conectado: '+res.finalPayload.address.slice(0,6)+'...'+res.finalPayload.address.slice(-4);
    } else {
      setStatus('❌ Cancelado o error: '+(res.finalPayload?res.finalPayload.status:'unknown'), false);
      document.getElementById('btn').innerText='Conectar Wallet';
    }
  }catch(e){
    setStatus('❌ Error: '+e.message, false);
    document.getElementById('btn').innerText='Conectar Wallet';
  }
}
</script>
</body>
</html>
